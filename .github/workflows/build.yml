
name: Build C++ EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: Get-ChildItem -Recurse -File

      - name: Compile C++
        run: g++ main.cpp -o program.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: program
          path: program.exe
